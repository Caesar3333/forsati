version: '3.9'

services:
  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    depends_on:
      - peeljobs-core
      - openresume-service
      - mock-interview
      - ai-orchestrator

  peeljobs-core:
    build: ./apps/peeljobs-core
    env_file:
      - .env
      - ./apps/peeljobs-core/.env
    command: ["/bin/sh", "-c", "python manage.py migrate && gunicorn opensourcejobportal.wsgi:application --bind 0.0.0.0:8000"]
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  openresume-service:
    build: ./apps/openresume-service
    env_file:
      - .env
      - ./apps/openresume-service/.env
    ports:
      - "3000:3000"

  mock-interview:
    build: ./apps/mock-interview
    env_file:
      - .env
      - ./apps/mock-interview/.env
    ports:
      - "3002:3002"

  ai-orchestrator:
    build: ./apps/ai-orchestrator
    env_file:
      - .env
      - ./apps/ai-orchestrator/.env
    command: ["/bin/sh", "-c", "uvicorn main:app --host 0.0.0.0 --port ${APP_PORT:-8003}"]
    ports:
      - "8003:8003"
    depends_on:
      - db

  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: peeljobs
      POSTGRES_PASSWORD: password
      POSTGRES_DB: peeljobs
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", ""]
    ports:
      - "6379:6379"

volumes:
  db-data:
