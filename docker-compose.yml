version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg14
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forsati}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forsati}
      POSTGRES_DB: ${POSTGRES_DB:-forsati}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-12-18T19-10-33Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-forsati}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-forsati123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/minio/health/ready > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  peeljobs-core:
    build: ./apps/peeljobs-core
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-changeme}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,peeljobs-core}
      DATABASE_URL: ${DATABASE_URL:-postgres://forsati:forsati@postgres:5432/forsati}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-forsati-secure}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-forsati}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-forsati123}
      S3_USE_SSL: ${S3_USE_SSL:-False}
    command: ["/bin/sh", "-c", "python manage.py migrate --noinput && gunicorn peeljobs_core.wsgi:application --bind 0.0.0.0:8000"]
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-orchestrator:
    build: ./apps/ai-orchestrator
    environment:
      APP_PORT: 8003
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REQUEST_LOG_LEVEL: ${REQUEST_LOG_LEVEL:-INFO}
    ports:
      - "${AI_PORT:-8003}:8003"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  web-frontend:
    build: ./apps/web-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost/api}
      NEXT_PUBLIC_AI_BASE_URL: ${NEXT_PUBLIC_AI_BASE_URL:-http://localhost/ai}
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      peeljobs-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  resume-service:
    build: ./apps/resume-service
    environment:
      PORT: 3001
    ports:
      - "${RESUME_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/ > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  interview-service:
    build: ./apps/interview-service
    environment:
      PORT: 3002
    ports:
      - "${INTERVIEW_PORT:-3002}:3002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/ > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      peeljobs-core:
        condition: service_healthy
      ai-orchestrator:
        condition: service_healthy
      web-frontend:
        condition: service_healthy
      resume-service:
        condition: service_healthy
      interview-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  minio-data:
