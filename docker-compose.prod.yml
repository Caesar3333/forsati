version: '3.9'

services:
  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    depends_on:
      - peeljobs-core
      - openresume-service
      - mock-interview
      - ai-orchestrator

  peeljobs-core:
    build:
      context: ./apps/peeljobs-core
    env_file:
      - .env
      - ./apps/peeljobs-core/.env
    command: ["/bin/sh", "-c", "python manage.py migrate && gunicorn opensourcejobportal.wsgi:application --bind 0.0.0.0:8000"]
    restart: unless-stopped
    depends_on:
      - db
      - redis

  openresume-service:
    build:
      context: ./apps/openresume-service
    env_file:
      - .env
      - ./apps/openresume-service/.env
    command: ["/bin/sh", "-c", "npm run start"]
    restart: unless-stopped

  mock-interview:
    build:
      context: ./apps/mock-interview
    env_file:
      - .env
      - ./apps/mock-interview/.env
    command: ["/bin/sh", "-c", "npm run start"]
    restart: unless-stopped

  ai-orchestrator:
    build:
      context: ./apps/ai-orchestrator
    env_file:
      - .env
      - ./apps/ai-orchestrator/.env
    command: ["/bin/sh", "-c", "uvicorn main:app --host 0.0.0.0 --port ${APP_PORT:-8003}"]
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: peeljobs
      POSTGRES_PASSWORD: password
      POSTGRES_DB: peeljobs
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", ""]
    restart: unless-stopped

volumes:
  db-data:
