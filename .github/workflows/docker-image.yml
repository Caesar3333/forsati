name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: [ web-frontend, ai-orchestrator, peeljobs-core, openresume-service, mock-interview ]

    steps:
    - uses: actions/checkout@v4
    - name: Build the ${{ matrix.app }} image
      run: docker build apps/${{ matrix.app }} --file apps/${{ matrix.app }}/Dockerfile --tag forsati-${{ matrix.app }}:${{ github.sha }}
