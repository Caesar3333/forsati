server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss;

    location /api/ {
        proxy_pass http://peeljobs-core:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /resume/ {
        proxy_pass http://openresume-service:3000/;
        proxy_set_header Host $host;
    }

    location /interview/ {
        proxy_pass http://mock-interview:3002/;
        proxy_set_header Host $host;
    }

    location /ai/ {
        proxy_pass http://ai-orchestrator:8003/;
        proxy_set_header Host $host;
    }

    location /static/ {
        proxy_pass http://peeljobs-core:8000/static/;
        expires 7d;
    }

    location /media/ {
        proxy_pass http://peeljobs-core:8000/media/;
    }

    location / {
        proxy_pass http://peeljobs-core:8000/;
        proxy_set_header Host $host;
    }
}
